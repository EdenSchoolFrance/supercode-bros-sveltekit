<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Shell dark outline -->
  <rect x="4"  y="15" width="24" height="13" fill="#1b5e20"/>
  <!-- Shell main green -->
  <rect x="5"  y="16" width="22" height="11" fill="#388e3c"/>
  <!-- Shell highlight top-left -->
  <rect x="7"  y="17" width="9"  height="5"  fill="#66bb6a"/>
  <!-- Shell mid-right -->
  <rect x="18" y="17" width="5"  height="9"  fill="#4caf50"/>
  <!-- Shell ridge horizontal -->
  <rect x="4"  y="21" width="24" height="2"  fill="#1b5e20"/>
  <!-- Shell ridge vertical -->
  <rect x="15" y="15" width="2"  height="13" fill="#1b5e20"/>

  <!-- Head -->
  <rect x="10" y="5"  width="12" height="11" fill="#fdd835"/>
  <rect x="11" y="15" width="10" height="1"  fill="#f9a825"/>

  <!-- Left eye -->
  <rect x="11" y="7"  width="4"  height="4"  fill="#ffffff"/>
  <rect x="12" y="8"  width="2"  height="2"  fill="#212121"/>
  <!-- Right eye -->
  <rect x="17" y="7"  width="4"  height="4"  fill="#ffffff"/>
  <rect x="18" y="8"  width="2"  height="2"  fill="#212121"/>

  <!-- Beak -->
  <rect x="14" y="13" width="4"  height="2"  fill="#ef6c00"/>

  <!-- Left arm -->
  <rect x="1"  y="18" width="4"  height="5"  fill="#fdd835"/>
  <!-- Right arm -->
  <rect x="27" y="18" width="4"  height="5"  fill="#fdd835"/>

  <!-- Left foot -->
  <rect x="7"  y="28" width="6"  height="3"  fill="#ef6c00"/>
  <rect x="5"  y="30" width="4"  height="1"  fill="#e65100"/>
  <!-- Right foot -->
  <rect x="19" y="28" width="6"  height="3"  fill="#ef6c00"/>
  <rect x="23" y="30" width="4"  height="1"  fill="#e65100"/>
</svg>
